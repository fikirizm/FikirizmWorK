crons:
  - name: weekly-summary
    description: "Her Pazartesi 09:00 (İstanbul) ekibe açık ve geciken görev özetini e-postayla gönderir"
    # Day-of-week is numeric 0-6 with 0=Sunday, so Monday is 1.
    cron: "0 9 * * 1"
    timezone: "Europe/Istanbul"
    endpoint: "{{BASE_URL}}/api/cron/weekly-summary"
    method: POST
    enabled: true
  - name: daily-reminder
    description: "Her sabah 08:00 (İstanbul) son tarihi bugün/yarın olan görevler için kişiye özel hatırlatma"
    cron: "0 8 * * *"
    timezone: "Europe/Istanbul"
    endpoint: "{{BASE_URL}}/api/cron/daily-reminder"
    method: POST
    enabled: true
